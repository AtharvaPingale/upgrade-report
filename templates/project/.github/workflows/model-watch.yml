# Scheduled mode: every weekday, evaluate models released since the last run as
# candidates against the baseline. Results land in the run's step summary and as
# an artifact; nothing is merged or deployed automatically.
# Needs a `schedule:` section in config.yaml.
name: model-watch

on:
  schedule:
    - cron: "0 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . "upgrade-report[anthropic] @ git+https://github.com/atharvapingale/upgrade-report@v1"
      - name: Restore cache and seen-model state
        uses: actions/cache/restore@v4
        with:
          path: .upgrade-report
          key: upgrade-report-watch-${{ github.run_id }}
          restore-keys: |
            upgrade-report-watch-
            upgrade-report-main-
      - run: upgrade-report scheduled --config config.yaml --out reports/scheduled
      - name: Save cache and seen-model state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .upgrade-report
          key: upgrade-report-watch-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-watch-reports
          path: reports/scheduled
          if-no-files-found: ignore

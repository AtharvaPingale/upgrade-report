[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "upgrade-report"
version = "0.1.0"
description = "Compare a baseline and a candidate LLM configuration with paired statistics and get a Ship / Ship with caveats / Don't ship verdict."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Atharva" }]
requires-python = ">=3.11"
keywords = ["llm", "evaluation", "langsmith", "statistics", "model-upgrade", "ci"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "jinja2>=3.1",
    "langsmith>=0.2",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
upgrade-report = "upgrade_report.cli:main"

[project.urls]
Homepage = "https://github.com/atharvapingale/upgrade-report"
Documentation = "https://github.com/atharvapingale/upgrade-report/tree/main/docs"
Issues = "https://github.com/atharvapingale/upgrade-report/issues"

[tool.hatch.build.targets.wheel]
packages = ["upgrade_report"]

# The `init` scaffold ships inside the wheel; in a source checkout it is read
# from templates/project directly.
[tool.hatch.build.targets.wheel.force-include]
"templates/project" = "upgrade_report/_project_template"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: calibration tests that run many simulated reports"]
